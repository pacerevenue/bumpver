# Publishes tags to PyPI (replaces Zuul uv-release).
#
# Prefer PyPI "trusted publishing" (OIDC) for this repository: configure the
# publisher on https://pypi.org/manage/project/PROJECT/settings/publishing/
# If you use a classic API token instead, set PYPI_API_TOKEN and add:
#   with:
#     password: ${{ secrets.PYPI_API_TOKEN }}

name: release

on:
  push:
    tags:
      # CalVer tags (e.g. 2025.1131, 2025.1131-alpha)
      - '[12][0-9][0-9][0-9].[0-9]*'
      - '[12][0-9][0-9][0-9].[0-9]*-*'
      # SemVer-style tags
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+a[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Prepare uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
