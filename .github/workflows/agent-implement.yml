name: agent-implement

on:
  workflow_dispatch:
    inputs:
      linear_ticket_id: { type: string, default: "" }
      task_title:       { type: string, default: "" }
      task_description: { type: string, default: "" }
  repository_dispatch:
    types: [linear-agent-task]
  issue_comment:               { types: [created] }
  pull_request_review_comment: { types: [created] }
  pull_request_review:         { types: [submitted] }

jobs:
  call:
    uses: pacerevenue/agent-ci/.github/workflows/agent-implement.yml@main
    secrets: inherit
    with:
      team: science
      runs_on: gha-org-runner-set-science
      extra_allowed_tools: "Bash(podman:*)"
      setup_docker_registry: "true"
      max_turns: "150"
      timeout_minutes: "60"
